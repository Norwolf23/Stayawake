name: StayAwake
options:
  bundleIdPrefix: studio.nickson
  deploymentTarget:
    macOS: "13.0"
targets:
  StayAwake:
    type: application
    platform: macOS
    sources:
      - StayAwake.swift
      - Assets.xcassets
    entitlements:
      path: StayAwake.entitlements
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: StayAwake
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: "© 2026 Nickson Studio"
        LSMinimumSystemVersion: "13.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.nickson.stayawake
        DEVELOPMENT_TEAM: 6272CRNH9G
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: 1
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
