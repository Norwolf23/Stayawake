name: Stayawake
options:
  bundleIdPrefix: studio.nickson
  deploymentTarget:
    macOS: "13.0"
targets:
  Stayawake:
    type: application
    platform: macOS
    sources:
      - Sources
      - Assets.xcassets
    entitlements:
      path: Stayawake.entitlements
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Stayawake
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: "© 2026 Nickson Studio"
        LSMinimumSystemVersion: "13.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.nickson.stayawake
        DEVELOPMENT_TEAM: 6272CRNH9G
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: 1
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
  Stayawake-iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources
      - Assets-iOS.xcassets
    info:
      path: Info-iOS.plist
      properties:
        CFBundleDisplayName: Stayawake
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: "© 2026 Nickson Studio"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_NAME: Stayawake
        PRODUCT_BUNDLE_IDENTIFIER: studio.nickson.stayawake
        DEVELOPMENT_TEAM: 6272CRNH9G
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
